name: Viewer core checks
on:
  push:
    branches: [work/active]
    paths: ['.github/workflows/application-architecture.yml']
  workflow_dispatch:
    inputs:
      group:
        description: Select one check group
        type: choice
        options:
          - node
          - gis
          - browser
          - lint
        default: node
      files:
        description: Exact repository-relative files (comma or newline separated)
        type: string
        default: ""
      test_name_pattern:
        description: Focused title fragment (regular expressions require whole_group approval)
        type: string
        default: ""
      whole_group:
        description: Explicitly authorize all files in the selected group
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Run only the explicitly selected scope
        shell: bash
        env:
          CHECK_GROUP: ${{ inputs.group }}
          CHECK_FILES: ${{ inputs.files }}
          CHECK_PATTERN: ${{ inputs.test_name_pattern }}
          CHECK_WHOLE_GROUP: ${{ inputs.whole_group }}
        run: |
          set -euo pipefail
          args=("--group=$CHECK_GROUP")
          while IFS= read -r file; do
            if [[ -n "$file" ]]; then args+=("--file=$file"); fi
          done < <(printf '%s\n' "$CHECK_FILES" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [[ -n "$CHECK_PATTERN" ]]; then args+=("--test-name-pattern=$CHECK_PATTERN"); fi
          if [[ "$CHECK_WHOLE_GROUP" == true ]]; then args+=(--allow-whole-group); fi
          node scripts/run-application-checks.mjs --plan "${args[@]}"
          pnpm install --frozen-lockfile --ignore-scripts
          if [[ "$CHECK_GROUP" == browser ]]; then
            node tools/data/library-data.mjs --prepare-metadata
            pnpm exec playwright install chromium
          fi
          node scripts/run-application-checks.mjs "${args[@]}"
      - name: Upload browser failure evidence
        if: inputs.group == 'browser' && failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  requested-globe-regression:
    name: Requested globe regression / ${{ matrix.scope.name }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/active' && github.event.head_commit.message == 'Run explicitly requested scoped globe regression and performance checks' && github.event.before == 'ab5e6b49891c6b27d345882b890c6ed13ec980cb'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        scope:
          - {"name":"node","group":"node","files":"tests/unit/data/globe-picking.test.mjs,tests/unit/data/globe-render-resources.test.mjs,tests/unit/data/globe-temporal-assets.test.mjs,tests/unit/data/globe-mesh.test.mjs,tests/unit/data/globe-camera.test.mjs,tests/unit/data/core-timeline-preparation.test.mjs","pattern":""}
          - {"name":"lint","group":"lint","files":"src/rendering/globe-gpu-resources.js,src/rendering/globe-history-index.js,src/rendering/globe-object-query.js,src/rendering/globe-view-mesh-assets.js,src/rendering/render-cache-budget.js,src/rendering/three-globe-labels.js,src/rendering/three-globe-rivers.js,src/rendering/three-globe-surface.js,src/rendering/three-viewer-renderer.js,tests/unit/data/globe-picking.test.mjs,tests/unit/data/globe-render-resources.test.mjs,tests/unit/data/globe-temporal-assets.test.mjs,tests/browser/viewer.spec.mjs","pattern":""}
          - {"name":"navigation-performance","group":"browser","files":"tests/browser/viewer.spec.mjs","pattern":"keeps its map ready and reuses loaded spatial chunks while navigating"}
          - {"name":"river-detail","group":"browser","files":"tests/browser/viewer.spec.mjs","pattern":"draws local detailed rivers"}
          - {"name":"history","group":"browser","files":"tests/browser/viewer.spec.mjs","pattern":"switches to changed historical meshes"}
          - {"name":"hydro-picking","group":"browser","files":"tests/browser/viewer.spec.mjs","pattern":"selects rendered rivers and dated water"}
          - {"name":"labels","group":"browser","files":"tests/browser/viewer.spec.mjs","pattern":"places and selects a built-in city"}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Run only the requested scope
        shell: bash
        env:
          CHECK_GROUP: ${{ matrix.scope.group }}
          CHECK_FILES: ${{ matrix.scope.files }}
          CHECK_PATTERN: ${{ matrix.scope.pattern }}
        run: |
          set -euo pipefail
          args=("--group=$CHECK_GROUP")
          IFS=, read -ra files <<< "$CHECK_FILES"
          for file in "${files[@]}"; do args+=("--file=$file"); done
          if [[ -n "$CHECK_PATTERN" ]]; then args+=("--test-name-pattern=$CHECK_PATTERN"); fi
          node scripts/run-application-checks.mjs --plan "${args[@]}"
          pnpm install --frozen-lockfile --ignore-scripts
          if [[ "$CHECK_GROUP" == browser ]]; then
            node tools/data/library-data.mjs --prepare-metadata
            pnpm exec playwright install chromium
          fi
          node scripts/run-application-checks.mjs "${args[@]}"
      - name: Upload browser failure evidence
        if: matrix.scope.group == 'browser' && failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.scope.name }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
