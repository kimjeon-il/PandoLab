name: Viewer core checks
on:
  push:
    branches: [work/active]
    paths: [.github/workflows/application-architecture.yml]
  workflow_dispatch:
    inputs:
      group:
        description: Select one check group
        type: choice
        options:
          - node
          - gis
          - browser
          - lint
        default: node
      files:
        description: Exact repository-relative files (comma or newline separated)
        type: string
        default: ""
      test_name_pattern:
        description: Focused title fragment (regular expressions require whole_group approval)
        type: string
        default: ""
      whole_group:
        description: Explicitly authorize all files in the selected group
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Run only the explicitly selected scope
        shell: bash
        env:
          CHECK_GROUP: ${{ inputs.group }}
          CHECK_FILES: ${{ inputs.files }}
          CHECK_PATTERN: ${{ inputs.test_name_pattern }}
          CHECK_WHOLE_GROUP: ${{ inputs.whole_group }}
        run: |
          set -euo pipefail
          args=("--group=$CHECK_GROUP")
          while IFS= read -r file; do
            if [[ -n "$file" ]]; then args+=("--file=$file"); fi
          done < <(printf '%s\n' "$CHECK_FILES" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [[ -n "$CHECK_PATTERN" ]]; then args+=("--test-name-pattern=$CHECK_PATTERN"); fi
          if [[ "$CHECK_WHOLE_GROUP" == true ]]; then args+=(--allow-whole-group); fi
          node scripts/run-application-checks.mjs --plan "${args[@]}"
          pnpm install --frozen-lockfile --ignore-scripts
          if [[ "$CHECK_GROUP" == browser ]]; then
            node tools/data/library-data.mjs --prepare-metadata
            pnpm exec playwright install chromium
          fi
          node scripts/run-application-checks.mjs "${args[@]}"
      - name: Upload browser failure evidence
        if: inputs.group == 'browser' && failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  requested-regression:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Run requested coast, hydro and source-completion repair checks'
    name: Requested regression / ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "completion"
            group: "gis"
            files: "tests/unit/data/library-whole-feature-completion.test.mjs"
            pattern: ""
          - label: "picking"
            group: "node"
            files: "tests/unit/data/globe-picking.test.mjs"
            pattern: ""
          - label: "repair-lint"
            group: "lint"
            files: "src/rendering/globe-object-query.js,src/rendering/three-viewer-renderer.js,tests/unit/data/globe-picking.test.mjs,tests/browser/viewer.spec.mjs,tests/unit/data/library-whole-feature-completion.test.mjs"
            pattern: ""
          - label: "coast"
            group: "browser"
            files: "tests/browser/viewer.spec.mjs"
            pattern: "uses territorial coastlines for coastal fill"
          - label: "hydro-pick"
            group: "browser"
            files: "tests/browser/viewer.spec.mjs"
            pattern: "selects rendered rivers and dated water"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Run only the explicitly selected scope
        shell: bash
        env:
          CHECK_GROUP: ${{ matrix.group }}
          CHECK_FILES: ${{ matrix.files }}
          CHECK_PATTERN: ${{ matrix.pattern }}
          CHECK_WHOLE_GROUP: false
        run: |
          set -euo pipefail
          args=("--group=$CHECK_GROUP")
          while IFS= read -r file; do
            if [[ -n "$file" ]]; then args+=("--file=$file"); fi
          done < <(printf '%s\n' "$CHECK_FILES" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [[ -n "$CHECK_PATTERN" ]]; then args+=("--test-name-pattern=$CHECK_PATTERN"); fi
          if [[ "$CHECK_WHOLE_GROUP" == true ]]; then args+=(--allow-whole-group); fi
          node scripts/run-application-checks.mjs --plan "${args[@]}"
          pnpm install --frozen-lockfile --ignore-scripts
          if [[ "$CHECK_GROUP" == browser ]]; then
            node tools/data/library-data.mjs --prepare-metadata
            pnpm exec playwright install chromium
          fi
          node scripts/run-application-checks.mjs "${args[@]}"
      - name: Upload browser failure evidence
        if: matrix.group == 'browser' && failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.label }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
