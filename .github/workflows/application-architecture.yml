name: Viewer core checks
on:
  push:
    branches: [work/active]
    paths: ['.github/workflows/application-architecture.yml']
  workflow_dispatch:
    inputs:
      group:
        description: Select one check group
        type: choice
        options:
          - node
          - gis
          - browser
          - lint
        default: node
      files:
        description: Exact repository-relative files (comma or newline separated)
        type: string
        default: ""
      test_name_pattern:
        description: Focused title fragment (regular expressions require whole_group approval)
        type: string
        default: ""
      whole_group:
        description: Explicitly authorize all files in the selected group
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Run only the explicitly selected scope
        shell: bash
        env:
          CHECK_GROUP: ${{ inputs.group }}
          CHECK_FILES: ${{ inputs.files }}
          CHECK_PATTERN: ${{ inputs.test_name_pattern }}
          CHECK_WHOLE_GROUP: ${{ inputs.whole_group }}
        run: |
          set -euo pipefail
          args=("--group=$CHECK_GROUP")
          while IFS= read -r file; do
            if [[ -n "$file" ]]; then args+=("--file=$file"); fi
          done < <(printf '%s\n' "$CHECK_FILES" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [[ -n "$CHECK_PATTERN" ]]; then args+=("--test-name-pattern=$CHECK_PATTERN"); fi
          if [[ "$CHECK_WHOLE_GROUP" == true ]]; then args+=(--allow-whole-group); fi
          node scripts/run-application-checks.mjs --plan "${args[@]}"
          pnpm install --frozen-lockfile --ignore-scripts
          if [[ "$CHECK_GROUP" == browser ]]; then
            node tools/data/library-data.mjs --prepare-metadata
            pnpm exec playwright install chromium
          fi
          node scripts/run-application-checks.mjs "${args[@]}"
      - name: Upload browser failure evidence
        if: inputs.group == 'browser' && failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  startup-packet-regression:
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/active' && github.event.head_commit.message == 'Run initial packet and Worker batch regression' && github.event.before == '0fd09a8cb73fa5e780f7e935aee50a1325ddbf59'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Run focused Node regressions and lint
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/run-application-checks.mjs --group=node --file=tests/unit/data/core-timeline-preparation.test.mjs --file=tests/unit/data/globe-render-resources.test.mjs --file=tests/unit/data/globe-temporal-assets.test.mjs
          node scripts/run-application-checks.mjs --group=lint --file=src/document/project-source-runtime.js --file=src/app/viewer-map.js --file=src/rendering/three-viewer-renderer.js --file=src/rendering/globe-asset-reader.js --file=src/rendering/globe-packet-tasks.js --file=src/rendering/workers/globe-packet-worker.js --file=src/rendering/three-globe-physical.js --file=tests/unit/data/core-timeline-preparation.test.mjs --file=tests/unit/data/globe-render-resources.test.mjs --file=tests/unit/data/globe-temporal-assets.test.mjs
